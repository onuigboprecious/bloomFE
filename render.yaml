services:
  # Go Backend API Web Service
  - type: web
    name: infarbloom-backend
    env: go
    rootDir: backend
    buildCommand: cd backend && go build -o server ./cmd/server
    startCommand: ./backend/server
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  # React Frontend Static Site
  - type: web
    name: infarbloom-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
